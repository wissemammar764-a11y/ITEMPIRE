<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Empire CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="interface.css">
</head>
<body>
 
<header class="topbar">
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5"/>
      </svg>
    </div>
    <div class="brand-text">
      <div class="t1">IT Empire <span>CRM</span></div>
      <div class="t2">Centre de formation</div>
    </div>
  </div>
  <div class="top-right">
    <div class="search-pill">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      Rechercher…
    </div>
    <div class="avatar">IE</div>
  </div>
</header>
 
<div class="layout">
 
  <!-- SIDEBAR -->
  <aside class="sidebar card">
    <h4>Menu</h4>
    <nav class="menu" id="menu"></nav>
  </aside>
 
  <!-- MAIN CONTENT -->
  <main class="content card" id="content"></main>
 
</div>
 
<script src="interface.js"></script>
</body>
</html>
